# SM8650 handhelds. Board compatibles from packages/kernel/dts, identity from
# system_files/usr/lib/armada/devices/*.conf.

[[device]]
dt.compatible = "ayaneo,pocket-s2"
device        = "ayaneo_pocket_s2"
variant       = "PocketS2"
friendly_name = "AYANEO Pocket S2"

[[device]]
dt.compatible = "konkr,pocket-fit"
device        = "konkr_pocket_fit"
variant       = "PocketFIT"
friendly_name = "KONKR Pocket FIT"

[[device]]
dt.compatible = "lenovo,tb321fu"
device        = "lenovo_legion_tab"
variant       = "LegionTabGen3"
friendly_name = "Lenovo Legion Tab Gen 3"

# The TB321FU boots through a UEFI (GUF296) that publishes SMBIOS, and
# steamos-manager matches DMI before the device tree when DMI exists.
[[device]]
dmi.sys_vendor   = "Lenovo"
dmi.product_name = "QRD"
device        = "lenovo_legion_tab"
variant       = "LegionTabGen3"
friendly_name = "Lenovo Legion Tab Gen 3"

# armada-powerd owns the governor and serves CpuScaling1 over remotes.d.
[cpu_scaling]
driver = "none"

# qcom_battmgr raises end thresholds below 55 to 55.
[battery_charge_limit]
suggested_minimum_limit = 55
method = "power_supply"
