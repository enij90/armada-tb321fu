# Bluetooth: no hands-free role for phones. A call routed to the tablet opens an
# eSCO link, and with an LE scan running the WCN7850 firmware hits a hardware
# error and the radio restarts. The tablet stays an audio gateway for headsets
# (their microphone works) and an A2DP/LE audio sink and source.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_ag hsp_ag ]
}
