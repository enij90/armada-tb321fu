# Lenovo TB321FU (installed by tb321fu-setup.service):
# - the cameras have no working driver yet (/dev/video* fail with ENOMEM) and the
#   v4l2 create-device hook never completes, which stalls WirePlumber's event queue:
#   no stream is ever linked and every audio client times out;
# - Game Mode has no xdg-desktop-portal.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.portal-permissionstore = disabled
  }
}
