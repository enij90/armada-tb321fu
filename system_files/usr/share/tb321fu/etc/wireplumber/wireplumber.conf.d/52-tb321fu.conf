# Lenovo TB321FU (installed by tb321fu-setup.service):
# - the cameras have no working driver yet (/dev/video* fail with ENOMEM) and the
#   v4l2 create-device hook never completes, which stalls WirePlumber's event queue:
#   no stream is ever linked and every audio client times out;
# - Game Mode has no xdg-desktop-portal.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.portal-permissionstore = disabled
  }
}

# Internal microphone: at 100 % speech peaks reach 0 dBFS (TX_DEC0 at the UCM
# +16 dB); start new installs at 80 % (0.8^3, the volume is linear here).
wireplumber.settings = {
  device.routes.default-source-volume = 0.512
}

# DisplayPort over USB-C: on unplug the DP driver holds the display commit that
# switches back to the panel until the DP audio stream is closed, and WirePlumber
# closes an idle sink only after 5 s: the panel stayed black that long. Close the
# idle DP sink after 0.5 s.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*DisplayPort.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0.5 } }
  }
]
