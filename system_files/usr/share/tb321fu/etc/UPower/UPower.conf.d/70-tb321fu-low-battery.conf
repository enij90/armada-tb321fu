# Lenovo TB321FU: power off instead of suspending when the battery runs out.
# UPower's default action here is a suspend, and the tablet keeps draining in
# s2idle until it browns out at 0% and boot-loops on the charger. The
# system-sleep hook 60-tb321fu-low-battery wakes it to re-check while it sleeps
# on battery.
[UPower]
PercentageLow=15.0
PercentageCritical=8.0
PercentageAction=5.0
CriticalPowerAction=PowerOff
