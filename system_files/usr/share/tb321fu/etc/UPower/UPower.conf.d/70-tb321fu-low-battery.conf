# Lenovo TB321FU: power off instead of suspending when the battery runs out.
# UPower's default action here is a suspend, and the tablet keeps draining in
# s2idle until the battery is flat, then stays dead on the charger until a
# forced reset. The system-sleep hook 60-tb321fu-low-battery wakes it to
# re-check while it sleeps on battery.
[UPower]
PercentageLow=15.0
PercentageCritical=6.0
PercentageAction=3.0
CriticalPowerAction=PowerOff
