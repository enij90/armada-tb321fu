# Lenovo TB321FU: q6apm-dai allows at most 65280-byte buffers with 2..8 periods;
# PipeWire's default buffer request fails (set_buffer_size_near: EINVAL).
monitor.alsa.rules = [
  {
    matches = [ { alsa.card_name = "Lenovo-Y700-TB321FU" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 0
      }
    }
  }
]
