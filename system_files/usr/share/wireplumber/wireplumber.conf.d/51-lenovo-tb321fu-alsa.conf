# Lenovo TB321FU: q6apm-dai allows at most 65280-byte buffers with 2..8 periods,
# in multiples of 480 frames; PipeWire's default buffer request fails
# (set_buffer_size_near: EINVAL).
#
# The device is batch, so PipeWire halves the period and caps it at 1024 / 2:
# period-size 1024 pins it to 512 -> 480 frames whatever the graph quantum.
# The buffer is then period-num x 480: 4 periods (40 ms) crackled on the
# speakers after boot (issue #6); 8 periods (80 ms, the driver maximum) removes
# nearly all of it.
monitor.alsa.rules = [
  {
    matches = [ { alsa.card_name = "Lenovo-Y700-TB321FU" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.period-num = 8
      }
    }
  }
  # The amps start 500 ms after the stream unmutes, so with the default
  # 5 s suspend the first half second of every sound after a pause was
  # lost; starting them sooner played that half second distorted. Keep
  # the speakers open instead (no measurable power cost with the screen
  # on; system sleep still closes them), and hold the graph at Steam's
  # 512 frames so a UI sound joining them does not switch the quantum.
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.force-quantum = 512
      }
    }
  }
]
