# Use case configuration for Retroid Pocket (rpduo / eliza)
# AW88166 speaker amp on Primary MI2S; ES8326 headset on Quaternary MI2S;
# on-board DMIC via the LPASS VA macro.
# Author: Teguh Sobirin <teguh@sobir.in>

Syntax 4

SectionUseCase."HiFi" {
	File "/RetroidPocket/ELIZA/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# Topology stream volumes (names truncated by ALSA to 44 chars)
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 100%"
	cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 100%"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
