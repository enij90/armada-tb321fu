# Use case configuration for Eliza (rpduo)
# Author: Teguh Sobirin <teguh@sobir.in>

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer QUATERNARY_MI2S_TX' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer QUATERNARY_MI2S_TX' 0"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback (ES8326)"

	EnableSequence [
		cset "name='DAC Playback Volume' 75%"
		cset "name='HPL Playback Volume' 75%"
		cset "name='HPR Playback Volume' 75%"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (ES8326)"

	EnableSequence [
		cset "name='ADC PGA SE Switch' 0"
		cset "name='ADC PGA Gain Volume' 10"
		cset "name='ADC Capture Volume' 215"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "ADC PGA Gain"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}

SectionDevice."Mic" {
	Comment "On-board digital microphones (VA macro DMIC0/1)"

	EnableSequence [
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_DEC0 Volume' 110"
		cset "name='VA_DEC1 Volume' 110"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 90
		CapturePCM "hw:${CardId},3"
		CaptureMixer "default:${CardId}"
	}
}
