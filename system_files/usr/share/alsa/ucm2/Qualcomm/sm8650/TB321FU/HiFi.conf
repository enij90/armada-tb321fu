# Lenovo Y700 TB321FU HiFi routing.
# Speaker path: AW882xx/AW2308 smart PAs on Secondary TDM, fed from MultiMedia2 (PCM 1).
# Headphone/headset path: WCD939x + RX/TX SoundWire + LPASS RX/TX macro, MultiMedia1 (PCM 0).
# DisplayPort-over-USB-C audio is intentionally left OUT for now: it shared
# MultiMedia1 (PCM 0) with the headphones, and until the DP graph teardown is
# fixed (handoff "Audio DP"/1b) a stale DP route wedges the DSP and drops all
# sound (2026-10-18/19 regressions). The verb still clears the DP mixer routes
# defensively, in case an old saved asound.state still has them set.
# The verb sets the default routes (MultiMedia1 -> headphones, MultiMedia2 ->
# speakers): PipeWire opens every PCM with only the verb set while it probes the
# profiles, and a PCM without a route fails to open, which drops every profile.
# A frontend feeds one backend at a time (two routes -> the DSP AR_EDUPLICATE).

SectionVerb {
	EnableSequence [
		# Clear the routes the verb does not use first: alsa-state restores the mixer
		# saved at the last shutdown, and a leftover second route on a frontend makes
		# the DSP refuse the stream (2026-10-18: MultiMedia1 -> DisplayPort and
		# MultiMedia2 -> headphones were restored, every profile probe failed and
		# WirePlumber stored the card profile as "off").
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
		PlaybackCTL "hw:LenovoY700TB321"
		CaptureCTL "hw:LenovoY700TB321"
	}
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"

	EnableSequence [
		cset "name='aw882xx_rx_switch' 1"
		cset "name='aw882xx_copp_switch' 1"
		cset "name='aw_dev_0_switch' 1"
		cset "name='aw_dev_1_switch' 1"
	]

	DisableSequence [
		cset "name='aw_dev_0_switch' 0"
		cset "name='aw_dev_1_switch' 0"
		cset "name='aw882xx_copp_switch' 0"
		cset "name='aw882xx_rx_switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:LenovoY700TB321,1"
		# Amplifier volume, linear in dB (kernel patch 0831): PipeWire drives it
		# instead of its own cubic software volume.
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MBHC Switch' 1"
		cset "name='CLSH Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:LenovoY700TB321,0"
		PlaybackMixer "default:LenovoY700TB321"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdhsmice.File "/codecs/wcd939x/HeadphoneMicEnableSeq.conf"
	Include.wcdhsmicd.File "/codecs/wcd939x/HeadphoneMicDisableSeq.conf"
	Include.txmhse.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhsd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	ConflictingDevice [
		"Mic1"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:LenovoY700TB321,2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Microphone"

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	ConflictingDevice [
		"Headset"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:LenovoY700TB321,2"
		CaptureMixerElem "ADC1"
	}
}
