# Replace Armada's /KERNEL hook (10-armada-bootimg.conf) with a dispatcher that
# syncs the GRUB FAT on the TB321FU and runs Armada's hook on other devices.
# ExecStop= first clears every ExecStop, so OSTree's own is listed again.
[Service]
ExecStop=
ExecStop=/usr/bin/ostree admin finalize-staged
ExecStop=/usr/libexec/tb321fu/boot-finalize
