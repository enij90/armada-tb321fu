[Service]
# Bound a hung InputPlumber to 5 s; "-" keeps HookWake running if HookSleep fails.
ExecStart=
ExecStart=-busctl --timeout=5 call org.shadowblip.InputPlumber /org/shadowblip/InputPlumber/Manager org.shadowblip.InputManager HookSleep
ExecStop=
ExecStop=busctl --timeout=5 call org.shadowblip.InputPlumber /org/shadowblip/InputPlumber/Manager org.shadowblip.InputManager HookWake
