ARMADA_DEVICE_ID=lenovo-legion-tab
ARMADA_DEVICE_NAME='Lenovo Legion Tab Gen 3'
ARMADA_SOC_CLASS=SM8650

# Native panel is portrait (1600x2560); the desktop rotates it to landscape.
ARMADA_PANEL_ORIENTATION=right
# The DPU inline rotator drops a line at the seam between the two layer mixers
# (visible in the middle of the screen); rotate in the compositor instead.
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
ARMADA_GAMEPAD_QUIRK=none
